name: HOL Plugin Scanner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: HOL Plugin Scanner
        # v1.2.490 pinned plugin-scanner 2.0.1091, which is no longer on PyPI.
        uses: hashgraph-online/ai-plugin-scanner-action@fe3a28696ed8316792c076c495482f602a59205d # v1.2.817 / scanner 3.59.0
        with:
          plugin_dir: plugins/armorcodex
          mode: scan
          min_score: 80
          fail_on_severity: high
          format: sarif
          upload_sarif: true
