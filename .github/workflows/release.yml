name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Read the version
        id: version
        run: |
          node -e '
            const v = require("./plugins/armorcodex/package.json").version;
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `tag=v${v}\n`);
          '

      - name: Skip a version that is already released
        id: tagged
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${TAG} is already tagged, nothing to release"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the manifests and the CHANGELOG section
        if: steps.tagged.outputs.exists == 'false'
        run: node .github/scripts/release-info.mjs . "${RUNNER_TEMP}/notes.md"

      - name: Test
        if: steps.tagged.outputs.exists == 'false'
        working-directory: plugins/armorcodex
        run: |
          npm ci --ignore-scripts
          npm test

      - name: Tag and publish the release
        if: steps.tagged.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "${TAG}" \
            --target "${GITHUB_SHA}" \
            --title "ArmorCodex ${TAG#v}" \
            --notes-file "${RUNNER_TEMP}/notes.md" \
            --latest
